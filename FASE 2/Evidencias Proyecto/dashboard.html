<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy7 — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="login-crest">
      <div class="mark">A7</div>
      <div class="school-name">Academy7</div>
    </div>

    <div class="sidebar-role" id="sidebarRole"></div>
    <ul class="nav-list" id="navList"></ul>

    <div class="sidebar-footer">
      <button class="logout-link" id="logoutBtn"><span class="dot"></span>Cerrar sesión</button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="mobile-toggle" id="mobileToggle">Menú</button>
      <div class="topbar-greeting">
        <h1 id="greetingTitle">Hola</h1>
        <div class="date" id="greetingDate"></div>
      </div>
      <div class="topbar-user">
        <div class="user-summary">
          <strong id="topUserName"></strong>
          <span id="topUserRole"></span>
        </div>
        <div class="avatar" id="topAvatar">--</div>
      </div>
    </header>

    <main class="content" id="content">
      <!-- El contenido de cada sección se inyecta con JavaScript. -->
    </main>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/school-seed.js"></script>
<script src="js/data.js"></script>
<script src="js/dashboard-shared.js"></script>
<script src="js/dashboard-teacher.js"></script>
<script src="js/dashboard-guardian.js"></script>
<script src="js/dashboard-student.js"></script>
<script src="js/dashboard-core.js"></script>
</body>
</html>
